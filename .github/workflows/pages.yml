name: Testuj i publikuj serwis
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Testuj modele i kontrakty
        run: npm test
      - name: Odczytaj konfigurację hosta
        id: pages
        uses: actions/configure-pages@v5
      - name: Zbuduj produkcję
        env:
          BUILD_TARGET: production
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          INDEXABLE: 'true'
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          # Pages może zgłaszać HTTP podczas wystawiania certyfikatu domeny.
          # Publikujemy wyłącznie kanoniczne adresy HTTPS.
          export SITE_URL="${SITE_URL/http:/https:}"
          npm run build
      - name: Sprawdź HTML, metadane i odnośniki
        run: npm run check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikuj
        id: deployment
        uses: actions/deploy-pages@v4
